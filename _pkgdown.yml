url: https://tanakak.github.io/FactorialSurvey/

template:
  bootstrap: 5

reference:
- title: Designing the experiment
  desc: >
    Build an efficient set of vignettes and check that it is well balanced.
  contents:
  - fs_defficient
  - fs_design_eval
  - print.fs_design
  - print.fs_design_eval

- title: Fielding the experiment
  desc: >
    Attach the wording respondents will see, allocate blocks and presentation
    orders, and write everything out for a survey platform.
  contents:
  - set_labels
  - fs_vignette_text
  - fs_williams
  - fs_assign
  - print.fs_assignment
  - fs_export

- title: Estimation
  desc: Fit models suited to bounded rating outcomes.
  contents:
  - fs_betareg
  - print.fs_betareg
  - summary.fs_betareg
  - print.summary.fs_betareg
  - fs_betareg-extractors

- title: Post-estimation
  desc: Translate estimates into reportable quantities.
  contents:
  - fs_mwtp
  - print.fs_mwtp
  - as.data.frame.fs_mwtp

- title: Package
  contents:
  - FactorialSurvey-package
